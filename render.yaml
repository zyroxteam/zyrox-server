services:
  - type: web
    name: zyrox-music-enhance
    runtime: python
    plan: free
    region: oregon
    # No apt needed — ffmpeg comes bundled via the imageio-ffmpeg pip package
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT --timeout 900 --workers 1 --threads 4"
    healthCheckPath: /api/health
